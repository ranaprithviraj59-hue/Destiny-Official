<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTINY - Professional Virtual Academy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="security.css">
    <script src="https://meet.jit.si/external_api.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern UI Cleanup */
        .footer-bar .join-box { display: none !important; } /* Hide confusing redundant join box */
        .footer-bar { justify-content: center !important; }
        #launch-screen { background: radial-gradient(circle at center, #1a1a2e, #0a0a0c) !important; }
        .login-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 380px; }
        input { transition: 0.3s; }
        input:focus { border-color: var(--primary) !important; box-shadow: 0 0 15px rgba(77, 171, 247, 0.3); }
        .role-btn { flex: 1; padding: 15px; border-radius: 12px; border: 2px solid #333; background: transparent; color: #aaa; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .role-btn.active { border-color: var(--primary); color: white; background: rgba(77, 171, 247, 0.1); }
    </style>
</head>
<body>
    <!-- Professional Launch Interface -->
    <div id="launch-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:10000; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white;">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <i class="fas fa-meteor" style="font-size: 4rem; color:#4dabf7; margin-bottom:15px;"></i>
                <h1 style="font-family:'Poppins'; letter-spacing: 5px; margin:0;">DESTINY</h1>
                <p style="color:#666; font-size: 0.8rem; letter-spacing: 2px;">SECURE ACADEMY ENGINE</p>
            </div>
            
            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <button id="select-teacher-btn" class="role-btn">HOST</button>
                <button id="select-student-btn" class="role-btn active">STUDENT</button>
            </div>
            
            <!-- Teacher Section -->
            <div id="teacher-login-box" class="hidden">
                <input type="password" id="admin-pass-input" placeholder="Admin Access Key" style="width:100%; padding:14px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:12px; text-align:center; font-size: 1rem;">
            </div>

            <!-- Student Section -->
            <div id="student-login-box">
                <input type="text" id="student-id-input" placeholder="Student ID" style="width:100%; padding:14px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:12px; text-align:center; margin-bottom:12px; font-size: 1rem;">
                <input type="password" id="student-pass-input" placeholder="Password" style="width:100%; padding:14px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:12px; text-align:center; font-size: 1rem;">
            </div>

            <button id="start-destiny-btn" style="width:100%; padding:18px; background:#4dabf7; border:none; color:white; border-radius:15px; font-weight:bold; cursor:pointer; font-size:1.1rem; margin-top:25px; box-shadow: 0 10px 25px rgba(77,171,247,0.4);">ENTER CLASSROOM</button>
        </div>
    </div>

    <div class="app-glass">
        <!-- DESTINY Top Bar -->
        <header class="top-bar">
            <div class="logo">
                <i class="fas fa-meteor"></i>
                <span>DESTINY</span>
            </div>
            <div class="meeting-status">
                <i class="fas fa-shield-alt" style="color: #40c057;"></i>
                <span id="status-text">End-to-End Encrypted</span>
            </div>
            <div class="user-info">
                <button id="copy-id-btn" title="Copy Invite Link">
                    <span id="my-id-display">Connecting...</span>
                    <i class="fas fa-link" style="margin-left: 10px;"></i>
                </button>
            </div>
        </header>

        <main class="content-area">
            <section class="stage">
                <!-- Whiteboard Overlay -->
                <div id="whiteboard-container" class="hidden">
                    <canvas id="whiteboard"></canvas>
                    <div class="board-controls">
                        <div class="tool-group">
                            <button id="tool-pen" class="board-btn active"><i class="fas fa-pencil-alt"></i></button>
                            <button id="tool-eraser" class="board-btn"><i class="fas fa-eraser"></i></button>
                            <input type="color" id="board-color" value="#4dabf7">
                            <button id="clear-board" class="board-btn"><i class="fas fa-sync-alt"></i></button>
                        </div>
                        <div class="board-label">Interactive Whiteboard</div>
                    </div>
                </div>

                <div class="video-grid" id="video-grid">
                    <div class="v-card local" id="local-wrapper" style="display:none;">
                        <video id="local-video" autoplay muted playsinline></video>
                    </div>
                </div>
            </section>

            <!-- Side Tools -->
            <aside class="sidebar hidden" id="sidebar">
                <nav class="side-nav">
                    <button class="nav-btn active" data-tab="notes"><i class="fas fa-file-alt"></i></button>
                    <button class="nav-btn" data-tab="chat"><i class="fas fa-comment"></i></button>
                    <button class="nav-btn" data-tab="admin" id="admin-tab-trigger"><i class="fas fa-user-shield"></i></button>
                </nav>

                <div class="tab-pane active" id="notes-tab">
                    <div class="pane-header">Shared Lesson Notes</div>
                    <textarea id="shared-notes" placeholder="Collaborative notes go here..."></textarea>
                </div>

                <div class="tab-pane" id="chat-tab">
                    <div class="pane-header">Classroom Chat</div>
                    <div id="chat-messages"></div>
                    <div class="chat-input-box">
                        <input type="text" id="chat-input" placeholder="Type a message...">
                        <button id="send-chat"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>

                <div class="tab-pane" id="admin-tab">
                    <div class="pane-header">Host Management</div>
                    <div class="admin-scroll">
                        <div class="admin-section">
                            <h3 style="margin-bottom:15px;"><i class="fas fa-user-plus" style="margin-right:8px;"></i>Create Student ID</h3>
                            <div style="display:flex; flex-direction:column; gap:10px;">
                                <input type="text" id="new-student-name" placeholder="Full Name" style="width:100%; padding:12px; background:rgba(255,255,255,0.05); border:1px solid var(--glass); color:white; border-radius:10px;">
                                <div style="display:flex; gap:10px;">
                                    <input type="text" id="new-student-id" placeholder="New ID" style="flex:1; padding:12px; background:rgba(255,255,255,0.05); border:1px solid var(--glass); color:white; border-radius:10px;">
                                    <input type="text" id="new-student-pass" placeholder="Password" style="flex:1; padding:12px; background:rgba(255,255,255,0.05); border:1px solid var(--glass); color:white; border-radius:10px;">
                                </div>
                                <button id="gen-student-code" class="btn-primary" style="padding:15px; border-radius:12px; font-weight:bold;">CREATE ACCOUNT</button>
                            </div>
                        </div>
                        <div class="admin-section">
                            <h3><i class="fas fa-shield-alt" style="margin-right:8px;"></i>Host Controls</h3>
                            <button id="mute-all-btn" class="btn-secondary" style="width:100%; border-color:var(--danger); color:var(--danger); padding:12px; border-radius:10px;">MUTE ALL MICs</button>
                        </div>
                        <div class="admin-section">
                            <h3><i class="fas fa-users" style="margin-right:8px;"></i>Registered Students</h3>
                            <div id="student-list"></div>
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="footer-bar">
            <div class="group center-controls">
                <button id="mic-btn" class="ctrl-btn active"><i class="fas fa-microphone"></i></button>
                <button id="cam-btn" class="ctrl-btn active"><i class="fas fa-video"></i></button>
                <button id="share-btn" class="ctrl-btn"><i class="fas fa-desktop"></i></button>
                <button id="board-btn" class="ctrl-btn"><i class="fas fa-chalkboard"></i></button>
                <button id="sidebar-btn" class="ctrl-btn"><i class="fas fa-th-large"></i></button>
                <button id="record-btn" class="ctrl-btn"><i class="fas fa-record-vinyl"></i></button>
                <button id="end-btn" class="ctrl-btn leave"><i class="fas fa-phone-slash"></i></button>
            </div>
        </footer>

        <!-- Pro Lobby Modal -->
        <div id="security-modal" class="modal hidden">
            <div class="modal-blur">
                <div class="modal-box" style="background: #111; border: 1px solid var(--primary);">
                    <div class="shield-icon" style="animation: pulse 2s infinite;"><i class="fas fa-door-open"></i></div>
                    <h2 id="student-knock-name">Student Knocking</h2>
                    <p style="margin-bottom:30px;">This student is waiting in the lobby. Admit them to the classroom?</p>
                    <div class="modal-btns">
                        <button id="admit-btn" class="btn-primary" style="padding:15px; border-radius:12px;">ADMIT STUDENT</button>
                        <button id="deny-btn" class="btn-secondary" style="padding:15px; border-radius:12px;">BLOCK</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
